name: Build Firmware
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: |
          pip install platformio "scons==4.8.1"
          python -c "import SCons.Tool, os; p = os.path.dirname(SCons.Tool.__file__); open(os.path.join(p, 'FortranCommon.py'), 'w').close()"
      - name: Build
        run: pio run
      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: xbloom-2inch-firmware
          path: .pio/build/crowpanel-advance-43/*.bin
