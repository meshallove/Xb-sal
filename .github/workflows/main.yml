name: Build Firmware
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: pip install platformio "scons==4.8.1"
      - name: Prepare Packages & Patch SCons
        run: |
          pio pkg install
          find ~/.platformio -type d -name "Tool" -path "*scons*" -exec touch "{}/FortranCommon.py" \;
      - name: Build
        run: pio run
      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: xbloom-2inch-firmware
          path: .pio/build/crowpanel-advance-43/*.bin
